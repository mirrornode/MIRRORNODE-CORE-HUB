name: Osiris Release Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'osiris/**'
      - 'tests/integration/**'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'
      - 'canon/charters/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'osiris/**'
      - 'tests/integration/**'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'
      - 'canon/charters/**'

permissions:
  contents: read

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository_owner }}/osiris
  IMAGE_TAG: ${{ github.sha }}
  COMPOSE_FILES: "docker-compose.yml docker-compose.ci.yml"

jobs:
  verify-charters:
    name: Verify Charters
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify OSIRIS charter signature
        run: |
          chmod +x canon/scripts/verify_signature.sh
          f=canon/charters/OSIRIS.md
          sig="${f}.sig"
          if [[ -f "$sig" ]]; then
            ./canon/scripts/verify_signature.sh "$f" "$sig" || { echo "Charter verification failed: $f"; exit 1; }
          else
            echo "Missing signature for $f"; exit 1
          fi

  validate-runtime-surface:
    name: Validate OSIRIS Runtime Surface
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: verify-charters
    outputs:
      ready: ${{ steps.surface.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check OSIRIS Docker surface
        id: surface
        run: |
          missing=0
          for f in osiris/Dockerfile docker-compose.yml; do
            if [[ ! -f "$f" ]]; then
              echo "::notice title=OSIRIS release disabled::Missing $f"
              missing=1
            fi
          done

          if [[ "$missing" -eq 0 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    if: >-
      github.repository == 'mirrornode/MIRRORNODE-CORE-HUB' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.validate-runtime-surface.outputs.ready == 'true' &&
      false
    name: Build Push Sign
    runs-on: ubuntu-latest
    needs: [verify-charters, validate-runtime-surface]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU and Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./osiris
          file: ./osiris/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Install Cosign
        run: |
          COSIGN_VERSION="v2.7.0"
          curl -fsSL -o /tmp/cosign.tar.gz "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-${COSIGN_VERSION}-linux-amd64.tar.gz"
          sudo tar -C /usr/local/bin -xzf /tmp/cosign.tar.gz cosign

      - name: Sign image with Cosign using OIDC
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --oidc-token "$ACTIONS_ID_TOKEN" \
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}

      - name: Verify image signature
        run: |
          cosign verify ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare CI compose override
        run: |
          cat > docker-compose.ci.yml <<EOF
          version: "3.8"
          services:
            osiris:
              image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
              healthcheck:
                test: ["CMD-SHELL", "curl -fsS http://localhost:8002/health || exit 1"]
                interval: 5s
                timeout: 3s
                retries: 12
          EOF

      - name: Run docker compose integration
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from tester

      - name: Collect logs
        if: always()
        run: |
          mkdir -p tests/integration/reports
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs osiris > tests/integration/osiris.log || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs tester > tests/integration/tester.log || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osiris-integration-artifacts
          path: |
            tests/integration/osiris.log
            tests/integration/tester.log
            tests/integration/reports/
          retention-days: 7

  promote:
    name: Promote Release Image
    runs-on: ubuntu-latest
    needs: integration-tests
    if: >-
      needs.integration-tests.result == 'success' &&
      github.repository == 'mirrornode/MIRRORNODE-CORE-HUB' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Verify cosign signature before promote
        run: |
          cosign verify ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}

      - name: Tag and push release image
        env:
          RELEASE_TAG: "release-${{ github.run_number }}"
        run: |
          docker pull ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          docker tag ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }} ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${RELEASE_TAG}
          docker push ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${RELEASE_TAG}
          echo "PROMOTED_IMAGE=${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${RELEASE_TAG}" >> $GITHUB_OUTPUT

  release-dossier-artifact:
    name: Upload OSIRIS Release Dossier
    runs-on: ubuntu-latest
    needs: promote
    if: >-
      needs.promote.result == 'success' &&
      github.repository == 'mirrornode/MIRRORNODE-CORE-HUB' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Create release dossier
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DOSSIER="$RUNNER_TEMP/osiris-release-${GITHUB_RUN_ID}.md"
          echo "## Osiris Release" > "$DOSSIER"
          echo "- run_id: ${GITHUB_RUN_ID}" >> "$DOSSIER"
          echo "- commit: ${GITHUB_SHA}" >> "$DOSSIER"
          echo "- image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}" >> "$DOSSIER"
          echo "- timestamp: $TIMESTAMP" >> "$DOSSIER"
          echo "" >> "$DOSSIER"
          echo "Generated after a successful release path." >> "$DOSSIER"
          echo "Review and authorize separately." >> "$DOSSIER"

      - name: Upload dossier artifact
        uses: actions/upload-artifact@v4
        with:
          name: osiris-release-dossier
          path: ${{ runner.temp }}/osiris-release-${{ github.run_id }}.md
          retention-days: 7
