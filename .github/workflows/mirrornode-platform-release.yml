# .github/workflows/mirrornode-platform-release.yml
name: MIRRORNODE Platform Release

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'lucian/**'
      - 'osiris/**'
      - 'tests/integration/**'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'
      - 'canon/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'lucian/**'
      - 'osiris/**'
      - 'tests/integration/**'
      - 'docker-compose.yml'
      - 'docker-compose.ci.yml'
      - 'canon/**'
      - '.github/workflows/**'

permissions:
  contents: read

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  verify-platform:
    name: Verify Charters & Integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.verify.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run full integrity verification
        run: |
          chmod +x canon/scripts/verify_integrity.sh
          ./canon/scripts/verify_integrity.sh

      - name: Set output
        id: verify
        run: echo "ok=true"

  validate-release-surface:
    name: Validate Runtime Release Surface
    runs-on: ubuntu-latest
    needs: verify-platform
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.surface.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check runtime Docker surface
        id: surface
        run: |
          missing=0
          for f in lucian/Dockerfile osiris/Dockerfile docker-compose.yml; do
            if [[ ! -f "$f" ]]; then
              echo "::notice title=Runtime release disabled::Missing $f"
              missing=1
            fi
          done

          if [[ "$missing" -eq 0 ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    if: >-
      github.repository == 'mirrornode/MIRRORNODE-CORE-HUB' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.validate-release-surface.outputs.ready == 'true' &&
      false
    name: Build • Sign (${{ matrix.runtime }})
    needs: [verify-platform, validate-release-surface]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        runtime: [lucian, osiris]
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: ${{ github.repository_owner }}/${{ matrix.runtime }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for image publication
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.runtime }}
          file: ./${{ matrix.runtime }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            --fulcio-url=https://fulcio.sigstore.dev \
            --rekor-url=https://rekor.sigstore.dev \
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp="^https://github.com/${{ github.repository_owner }}/.github/workflows/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}

  integration-tests:
    name: Integration Tests (${{ matrix.runtime }})
    needs: [validate-release-surface, build-and-push]
    if: >-
      github.repository == 'mirrornode/MIRRORNODE-CORE-HUB' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.validate-release-surface.outputs.ready == 'true'
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        runtime: [lucian, osiris]
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: ${{ github.repository_owner }}/${{ matrix.runtime }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set runtime variables
        run: |
          echo "HEALTH_PORT=$([[ ${{ matrix.runtime }} == 'lucian' ]] && echo 8001 || echo 8002)" >> $GITHUB_ENV
          echo "HEALTH_PATH=/health" >> $GITHUB_ENV

      - name: Log in to GHCR for read-only test image pull
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare CI compose override
        run: |
          cat > docker-compose.ci.yml <<EOF
          version: "3.8"
          services:
            ${{ matrix.runtime }}:
              image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
              healthcheck:
                test: ["CMD-SHELL", "curl -fsS http://localhost:${{ env.HEALTH_PORT }}${{ env.HEALTH_PATH }} || exit 1"]
                interval: 5s
                timeout: 3s
                retries: 12
          EOF

      - name: Run integration tests
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up \
            --abort-on-container-exit \
            --exit-code-from tester

      - name: Collect logs
        if: always()
        run: |
          mkdir -p tests/integration/reports
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs ${{ matrix.runtime }} > tests/integration/${{ matrix.runtime }}.log || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs tester > tests/integration/tester.log || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runtime }}-integration-artifacts
          path: tests/integration/
          retention-days: 7

  promote:
    name: Promote Release Images
    needs: integration-tests
    if: >-
      needs.integration-tests.result == 'success' &&
      github.repository == 'mirrornode/MIRRORNODE-CORE-HUB' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      false
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        runtime: [lucian, osiris]
    runs-on: ubuntu-latest
    steps:
      - name: Set runtime variables
        id: vars
        run: |
          echo "IMAGE_REPO=${{ github.repository_owner }}/${{ matrix.runtime }}" >> $GITHUB_ENV

      - name: Pull, retag & push release image
        env:
          RELEASE_TAG: "release-${{ github.run_number }}"
        run: |
          docker pull ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }}
          docker tag ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ env.IMAGE_TAG }} ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${RELEASE_TAG}
          docker push ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPO }}:${RELEASE_TAG}

  platform-dossier:
    name: Upload Platform Release Dossier
    needs: promote
    if: >-
      needs.promote.result == 'success' &&
      github.repository == 'mirrornode/MIRRORNODE-CORE-HUB' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Create platform release dossier
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DOSSIER="$RUNNER_TEMP/mirrornode-platform-release-${GITHUB_RUN_ID}.md"
          echo "## MIRRORNODE Platform Release" > "$DOSSIER"
          echo "- run_id: ${GITHUB_RUN_ID}" >> "$DOSSIER"
          echo "- commit: ${GITHUB_SHA}" >> "$DOSSIER"
          echo "- lucian_image: ghcr.io/${{ github.repository_owner }}/lucian:${{ env.IMAGE_TAG }}" >> "$DOSSIER"
          echo "- osiris_image: ghcr.io/${{ github.repository_owner }}/osiris:${{ env.IMAGE_TAG }}" >> "$DOSSIER"
          echo "- timestamp: $TIMESTAMP" >> "$DOSSIER"
          echo "" >> "$DOSSIER"
          echo "Generated after a successful release path." >> "$DOSSIER"
          echo "Review and authorize separately." >> "$DOSSIER"

      - name: Upload dossier artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirrornode-platform-release-dossier
          path: ${{ runner.temp }}/mirrornode-platform-release-*.md
          retention-days: 7
