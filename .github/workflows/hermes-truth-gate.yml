name: Hermes Truth Gate

on:
  pull_request:
    branches: [main]

jobs:
  truth-semantics:
    name: Hermes Truth Semantics
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: pip install --quiet pytest fastapi httpx pydantic requests

      - name: Run Hermes truth tests
        run: |
          python -m pytest -q \
            tests/test_invoke_truth_semantics.py \
            tests/test_hermes_truth_semantics.py
