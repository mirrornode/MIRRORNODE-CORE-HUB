name: Canon Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  canon-gate:
    name: Contract Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install contract-test dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema[format]>=4.23.0" "pytest>=8,<9"

      - name: Run Canon Gate regression tests
        run: python -m unittest tests/test_canon_gate.py

      - name: Run CG-0036 schema and hardening tests
        run: |
          python -m unittest tests/test_cg0036_hardening.py
          python -m pytest -q tests/test_cg0036_exact_head_closure.py

      - name: Run Canon Gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/canon_gate.py
