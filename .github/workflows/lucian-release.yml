name: Lucian Release

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'lucian/**'
      - 'canon/**'
      - '.github/workflows/lucian-release.yml'
      - '.github/workflows/reusable-runtime-release.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'lucian/**'
      - 'canon/**'
      - '.github/workflows/lucian-release.yml'
      - '.github/workflows/reusable-runtime-release.yml'
  workflow_dispatch:

jobs:
  release:
    uses: ./.github/workflows/reusable-runtime-release.yml
    with:
      runtime: lucian
      health_port: "8001"
      image_tag: ${{ github.sha }}
