$schema: https://json-schema.org/draft/2020-12/schema
$id: https://mirrornode.xyz/schemas/council/matter.schema.yaml
title: MIRRORNODE Council Matter
schemaVersion: "0.1"
type: object
additionalProperties: false
required:
  - schemaVersion
  - id
  - title
  - matterType
  - initiator
  - createdAt
  - workflowState
  - disposition
  - decisionQuestion
  - scope
  - authorityPath
  - referenceArtifacts
properties:
  schemaVersion:
    const: "0.1"
  id:
    type: string
    pattern: '^CG-[0-9]{4}$'
  title:
    type: string
    minLength: 3
  matterType:
    enum: [protocol, policy, architecture, product, governance, implementation, incident-review]
  initiator:
    type: string
    minLength: 1
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
  workflowState:
    enum: [intake, framing, assembled, deliberating, synthesis-ready, closed]
  disposition:
    type: object
    additionalProperties: false
    required: [status]
    properties:
      status:
        enum: [pending, ratified, revision-required, parked, rejected]
      authority:
        type: [string, 'null']
      decidedAt:
        type: [string, 'null']
        format: date-time
      record:
        type: [string, 'null']
  decisionQuestion:
    type: string
    minLength: 10
  scope:
    type: object
    additionalProperties: false
    required: [includes, excludes]
    properties:
      includes:
        type: array
        items: {type: string}
      excludes:
        type: array
        items: {type: string}
  authorityPath:
    type: object
    additionalProperties: false
    required: [finalAuthority, canonAction]
    properties:
      finalAuthority:
        const: operator
      canonAction:
        enum: [separate-explicit-action, prohibited]
  requiredReviews:
    type: array
    uniqueItems: true
    items: {type: string}
  optionalReviews:
    type: array
    uniqueItems: true
    items: {type: string}
  referenceArtifacts:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, kind, href]
      properties:
        id: {type: string}
        kind: {enum: [pull-request, document, commit, repository, issue, external-reference]}
        href: {type: string}
        canonical: {type: boolean}
  openQuestions:
    type: array
    items: {type: string}
  currentRevision:
    type: [string, 'null']
  nextRequiredStep:
    type: string
  historyPath:
    type: string
  notes:
    type: array
    items: {type: string}
allOf:
  - if:
      properties:
        workflowState: {const: closed}
    then:
      properties:
        disposition:
          properties:
            status:
              enum: [ratified, revision-required, parked, rejected]
  - if:
      properties:
        disposition:
          properties:
            status: {const: pending}
    then:
      properties:
        workflowState:
          enum: [intake, framing, assembled, deliberating, synthesis-ready]
