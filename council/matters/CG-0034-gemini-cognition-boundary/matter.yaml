openQuestions:
  - Should bounded model cognition become a ninth MICC primitive family?
  - Would a separate cognition contract preserve cleaner semantics than MICC expansion?
  - What is the minimum provenance required to make model output contestable rather than authoritative?
  - Which receipt fields belong under existing AUDIT_EMISSION evidence without redefining locked semantics?
  - What separates a provider adapter from an instantiated Room presence in machine-readable terms?
