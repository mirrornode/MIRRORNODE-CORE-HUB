notes:
  - No preferred classification is established by opening this matter.
  - EVIDENCE is provisionally rejected as a convenience label because its MICC semantics concern telemetry and receipts rather than inference.
  - Any later Gemini pilot begins read-only and non-executing unless separately authorized.
