workflowState: open
decisionQuestion: >-
  How should MIRRORNODE reduce routine Operator intervention through bounded,
  inspectable, revocable delegation without transferring Operator sovereignty
  or allowing delegated authority to expand itself?
scope:
  includes:
    - delegation-authority-classes
    - machine-readable-delegation-envelope
    - anti-self-expansion-invariants
    - expiry-and-revocation-semantics
    - escalation-thresholds
    - operator-load-boundary
    - action-classification-separation
    - attribution-and-receipt-requirements
    - internal-first-product-ready-semantics
  excludes:
    - runtime-implementation
    - production-policy-changes
    - new-agent-permissions
    - automatic-merges
    - deployment
    - credential-access
    - execution-expansion
    - canon-promotion
    - publication
    - merge-authority
authorityPath:
  finalAuthority: operator
  implementationAction: separate-explicit-action
requiredReviews:
  - ptah
  - thoth
  - osiris
  - theia
referenceArtifacts:
  - id: CG-0034-PR
    kind: pull-request
    href: https://github.com/mirrornode/MIRRORNODE-CORE-HUB/pull/46
    canonical: false
  - id: CG-0035-PR
