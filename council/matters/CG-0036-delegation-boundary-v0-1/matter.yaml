    canonical: false
openQuestions:
  - Which actions are presumptively non-delegable?
  - Who may classify an action into a delegation class?
  - What evidence is required to prove an action stayed inside its envelope?
  - How should revocation race with already-started work?
  - How should delegation compose across multiple agents without authority multiplication?
  - What minimum UI/HUD representation lets the Operator inspect delegation without becoming a transit bottleneck?
currentRevision: initial-filing-2026-08-14
nextRequiredStep: >-
  Draft the Delegation Boundary v0.1 specification and machine-readable envelope,
  then obtain bounded Ptah, Thoth, Osiris, and Theia review before Operator disposition.
historyPath: history/
notes:
  - Internal-first, product-ready by design.
  - Delegated actors may not modify their own delegation scope, ceiling, expiry, revocation rule, or governing policy.
  - The goal is provable bounded autonomy, not maximal autonomy.
