openQuestions:
  - What concrete policy language/engine and AuthZEN-compatible transport profile should implementation use?
  - What concrete identity/attestation mechanism should production PDP, PEP, and executor workloads use?
  - What revocation-state distribution mechanism can meet declared freshness bounds under degraded network conditions?
  - What implementation will be commissioned for the typed delegation receipt mapping to the repaired AUDIT_EMISSION contract?
  - What numeric production risk, budget, blast-radius, and monitoring thresholds should commission AUTONOMOUS_WITHIN_POLICY?
  - What separately governed Council disposition validator should prove required composition, provenance, and quorum before Council approval can produce ALLOW? Existing council/schemas/disposition.schema.yaml and CG-0031 verify Operator dispositions, not Council constitution. Blocking implementation dependency; preserve for Osiris/Theia review.
currentRevision: draft-2-exact-head-codex-correction
nextRequiredStep: >-
  Run focused schema/conformance checks and a fresh Codex review on the exact correction head,
  then obtain exact-target revision confirmations from Ptah, Thoth, Osiris, and Theia. Require
  a full lane re-review where the correction materially changes that lane's analysis.
historyPath: history/
notes:
  - Internal-first, product-ready by design.
  - Draft.2 aligns conceptually with current AuthZEN, NIST zero-trust/access-control, SPIFFE, AI risk-management, ISO AI-management, and OWASP agentic-security practices without claiming certification.
  - Delegated actors may not modify their own delegation scope, ceilings, policy, classification inputs, revocation/expiry rules, resource mappings, or aggregate-authority logic.
  - The goal is provable bounded autonomy, not maximal autonomy.
  - AUDIT_EMISSION shell/heredoc corruption is confirmed and isolated to separate draft repair PR #49.
  - Council-required ALLOW remains fail-closed until a separately governed disposition validator proves required composition, provenance, and quorum. Existing disposition.schema.yaml and CG-0031 are Operator-disposition records/gates, not Council constitution. v0.1 additionally makes APPROVAL_COUNCIL+ALLOW schema-invalid; a future schema revision is required after that validator is ratified.
