notes:
  - Internal-first, product-ready by design.
  - Draft.2 aligns conceptually with current AuthZEN, NIST zero-trust/access-control, SPIFFE, AI risk-management, ISO AI-management, and OWASP agentic-security practices without claiming certification.
  - Delegated actors may not modify their own delegation scope, ceilings, policy, classification inputs, revocation/expiry rules, resource mappings, or aggregate-authority logic.
  - The goal is provable bounded autonomy, not maximal autonomy.
  - AUDIT_EMISSION shell/heredoc corruption is confirmed and isolated to separate draft repair PR #49.
