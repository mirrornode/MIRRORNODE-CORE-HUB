decision: >-
  Accept the revised MCP Surface Contract v0.1 and authorize finalization and
  merge of PR #33 as a governance-definition record only.
rationale: >-
  The initial Council review supported the downstream read-only projection
  architecture subject to R1 deterministic failure semantics and R2 a
  primitive-independent MCP boundary. The Operator authorized those bounded
  documentary revisions. Ptah, Thoth, and Osiris subsequently confirmed the
  revised definition with no remaining definition-level blocker. Acceptance
  therefore applies to the governing definition and documentary Council record
  only.
