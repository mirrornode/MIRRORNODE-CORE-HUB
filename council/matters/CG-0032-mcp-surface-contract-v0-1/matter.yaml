  - dependency-direction-preserves-canonical-authority
  - raw-canonical-state-is-not-approved-by-default
  - integrity-language-does-not-imply-authorization-or-truth
  - failure-behavior-is-closed-and-disclosure-minimized
  - prompt-injection-boundary-is-explicit
  - permanent-read-only-anti-capabilities-are-explicit
  - implementation-location-remains-separate-future-decision
