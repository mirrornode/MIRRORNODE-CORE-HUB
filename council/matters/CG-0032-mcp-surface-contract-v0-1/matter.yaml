decisionQuestion: >-
  Should MIRRORNODE adopt MCP Surface Contract v0.1 as the governing definition
  for a read-only downstream MCP projection surface, while preserving the current
  local four-tool prototype as frozen evidence and requiring a separate later
  authorization for any executable remediation, relocation, additional runtime
  attachment, remote exposure, or capability expansion?

