nextRequiredStep: >-
  Obtain Theia, Ptah, Thoth, and Osiris advisory reviews of the actual contract
  text. Do not modify the MCP executable or its registration while CG-0032 is
  under review. After synthesis, reserve final disposition to the Operator.

notes:
  - The prior prototype review informed this draft but does not substitute for review of the contract text.
  - Acceptance of this matter would define governance only; it would not authorize executable remediation.
  - Any write-capable MCP proposal is a different architectural class and requires a separate Council matter.
