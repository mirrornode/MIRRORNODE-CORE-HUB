    eventsChecked: 45
    errors: 0
  evidenceMeaning: >-
    Observation only. The prototype is technically operational but is not
    ratified architecture and its current output shapes are not automatically
    approved by this matter.

proposedRole:
  architecturalClass: downstream-read-only-projection
  canonicalAuthority: false
  executionAuthority: false
  dispositionAuthority: false
  publicationAuthority: false
  invariant: >-
    Canonical MIRRORNODE mechanisms may feed an approved projection into MCP.
    No canonical mechanism may depend on MCP output to establish authority,
    approval, truth, integrity, or execution permission.

authorizedScopeRequested:
  - projection-role-definition
  - canonical-dependency-direction
  - field-allowlist-principle
  - prompt-injection-boundary
  - integrity-semantics-definition
  - failure-contract-definition
  - anti-capability-definition
  - implementation-evidence-requirements
  - surface-expansion-gate
  - separate-authorization-gates

