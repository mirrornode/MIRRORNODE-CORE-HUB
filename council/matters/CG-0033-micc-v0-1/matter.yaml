  - credential-requirements-carry-no-credential-contents
  - receipt-requirements-are-additive-to-AUDIT_EMISSION-not-contradictory
  - MICC-evidence-fields-not-presumed-canonical-until-Osiris-resolves-mapping
  - MCP-downstream-read-only-direction-preserved-from-CG-0032
  - MCP-protocol-boundary-rule-is-unambiguous-and-inversion-prohibited
