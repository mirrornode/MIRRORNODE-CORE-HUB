anchors:
  - id: MCP-SURFACE-CONTRACT
    kind: council-matter
    href: ../CG-0032-mcp-surface-contract-v0-1/
    requiredState: accepted-governing-definition
    relationship: >-
      CG-0032 remains governing for MCP as a downstream read-only projection
      surface. MICC preserves canonical-outward dependency direction and
      adds protocol-neutral bypass resistance. Any inbound, write-capable,
      or execution-bearing MCP path requires separate Council authority.
  - id: AUDIT-EMISSION-CONTRACT
    kind: document
    href: ../../../canon/contracts/AUDIT_EMISSION.md
    requiredState: locked
    relationship: >-
      MICC preserves locked AUDIT_EMISSION top-level fields and vocabularies.
      Osiris resolved MICC-specific evidence placement as an additive
      namespaced extension under the existing evidence object at evidence.micc.
      No AUDIT_EMISSION contract change is made by CG-0033.
  - id: CURRENT-GOVERNANCE-AND-REGISTRY-EVIDENCE
    kind: governance-boundary
    href: ../../../docs/continuity/LUCIAN_AND_RUNTIME_RECONCILIATION_2026-08-13.md
    requiredState: current-reference
    relationship: >-
      MICC does not freeze the historical April Lucian /dispatch runtime model.
      Intra-lattice identity and authority are resolved from current applicable
      governance and registry evidence at invocation time. Historical runtime
      contracts remain evidence of their generation only.
