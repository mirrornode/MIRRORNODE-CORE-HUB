decisionQuestion: >-
  Should MIRRORNODE accept MICC v0.1 as the reviewed pre-canon normative
  specification governing what an integration means inside MIRRORNODE and
  MIM v0.1 as its machine-readable adapter declaration schema, subject to
  the filed review conditions and with canon promotion, implementation,
  deployment, and merge remaining separately authorized actions?
