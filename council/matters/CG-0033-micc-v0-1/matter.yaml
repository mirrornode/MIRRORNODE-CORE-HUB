decisionQuestion: >-
  Should MIRRORNODE adopt MICC v0.1 as the normative specification governing
  what an integration means inside MIRRORNODE—defining capability, authority,
  principal, scope, approval, execution, evidence, and lifecycle semantics—
  and MIM v0.1 as the machine-readable adapter declaration schema that
  implements MICC, while explicitly prohibiting any provider from becoming
  semantic authority merely by implementing a capability?

