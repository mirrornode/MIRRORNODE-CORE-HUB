openQuestions:
  - >-
      EVIDENCE FIELD MAPPING: MICC introduces execution_nonce, requesting
      actor, executing actor, approval object, and policy_version as
      evidence fields. Osiris must determine whether these are: (a)
      adapter-receipt extensions carried inside the existing AUDIT_EMISSION
      evidence object; (b) parallel MICC records that reference audit_id;
      or (c) grounds for a future AUDIT_EMISSION revision matter. MICC v0.1
      declares requirements only; canonical field placement is unresolved
      until Osiris issues a determination.
  - >-
      LIFECYCLE STATE MACHINE PLACEMENT: Should the adapter lifecycle
      (DECLARED through RETIRED) live in MICC itself as a normative
      requirement, or in a separate MIRRORNODE Runtime Registry specification
      that implements MICC? Ptah and Thoth should advise on whether lifecycle
      enforcement is a contract concern or a runtime concern.
  - >-
      MIM SCHEMA FORMAT: MIM v0.1 is drafted as JSON Schema with a YAML
      example. Given existing matter.yaml conventions, should MIM also
      carry a canonical YAML schema alongside the JSON Schema? Ptah to advise
      on tooling validation requirements.

