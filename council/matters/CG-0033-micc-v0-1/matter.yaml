  - AUTHORIZED-is-explicitly-separate-from-VERIFIED
  - authorization-bearing-transitions-carry-machine-verifiable-approval-reference
  - credential-requirements-carry-no-credential-contents-or-prohibited-sensitive-metadata
  - receipt-requirements-preserve-locked-AUDIT_EMISSION-top-level-semantics
  - MICC-specific-evidence-is-nested-under-evidence-micc
  - external-telemetry-remains-observer-not-evidence-authority
  - MCP-downstream-read-only-direction-preserved-from-CG-0032
