anchors:
  - id: MCP-SURFACE-CONTRACT
    kind: council-matter
    href: ../CG-0032-mcp-surface-contract-v0-1/
    requiredState: accepted-governing-definition
    relationship: >-
      CG-0032 remains the governing definition for MCP as a downstream
      read-only projection surface. Dependency direction is from canonical
      MIRRORNODE outward to the external MCP runtime—not inward. MICC
      governs integration providers and does not classify MCP as an adapter.
      No adapter or extension created under MICC may invert that dependency
      direction. Any inbound invocation, write-capable MCP surface, or
      MCP-mediated execution path requires separate Council authority.
      Canonical MIRRORNODE mechanisms may not depend on MCP output for
      authority, approval, truth, integrity, or execution permission.

  - id: AUDIT-EMISSION-CONTRACT
    kind: document
    href: ../../../canon/contracts/AUDIT_EMISSION.md
    requiredState: locked
    relationship: >-
      MICC Section 9 (canonical receipt requirements) is strictly additive
      to the locked AUDIT_EMISSION contract. MICC does not redefine or
      extend the AUDIT_EMISSION schema fields (timestamp, repo, repo_hash,
      charter_hash, event_type, actor, verdict, evidence, audit_id).
      Additional MICC evidence fields—such as execution_nonce, requesting
      actor, executing actor, approval object, and policy_version—are
      candidates for adapter-receipt extensions or parallel MICC records
      referencing audit_id, but their canonical status relative to
      AUDIT_EMISSION is an open question for Osiris to resolve during review.
      No field declared in MICC may contradict an AUDIT_EMISSION field
      with different semantics.

  - id: SYSTEM-CONTRACT
    kind: document
    href: ../../../SYSTEM_CONTRACT.md
    requiredState: reference-only
    relationship: >-
      MICC principal semantics must be coherent with the agent registry
      and execution authority established in SYSTEM_CONTRACT v1.1.
      Lucian's execution authority (POST /dispatch) is not redefined by
      MICC. Integration adapter principals are a distinct class from
      lattice agents; MICC defers to SYSTEM_CONTRACT for all intra-lattice
      principal identity claims.

