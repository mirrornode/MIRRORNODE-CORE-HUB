  - approval-classification-is-machine-readable
  - conformance-requirements-are-testable
  - current-authority-is-not-hard-coded-to-superseded-runtime-generation
  - no-provider-implementation-introduced-by-this-matter
  - all-artifacts-remain-under-docs-integration-not-canon
resolvedQuestions:
  evidenceFieldMapping: >-
    Resolved by Osiris: MICC-specific evidence is carried inside the existing
    locked AUDIT_EMISSION evidence object under evidence.micc.
  lifecyclePlacement: >-
    Lifecycle semantics and authority remain normative in MICC; a Runtime
    Registry may implement and persist them only as a subordinate enforcement surface.
  mimSchemaFormat: >-
    JSON Schema remains the canonical machine-validation schema. YAML may be
    a serialization/example format; no second canonical YAML schema is required.
